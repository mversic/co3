[workspace]
members = ["derive"]

[workspace.package]
version = "0.9.1"
edition = "2024"
license = "Apache-2.0"
authors = ["Marin Veršić <marin.versic101@gmail.com>"]

# Required for the UnsafeCell transmutation guarantees used by this crate.
rust-version = "1.99"

[package]
name = "co3"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

description = "Build C API from Rust"
repository = "https://github.com/mversic/co3"
categories = ["development-tools::ffi", "no-std"]
keywords = ["FFI", "foreign", "dynamic", "linking", "ABI"]

[features]
# Implements conversion traits for types from the `alloc` crate (e.g. `Box<T>` or `Vec<T>`).
alloc = ["rust-spec/alloc", "co3-derive?/alloc"]

# Enables:
# - deriving C-compatible representations with `#[derive(ReprC)]`
# - generating `extern "C"` companion functions via `raw!`
# - writing exports/extern FFI declarations via `ffi!`
derive = ["co3-derive"]

# Enables conversions for types with unspecified Rust layouts.
repr-rust = ["co3-derive?/repr-rust"]

default = ["alloc", "derive", "repr-rust"]

[dependencies]
co3-derive = { version = "0.9.1", path = "derive", optional = true, default-features = false }

rust-spec = { version = "0.7.3", default-features = false, features = ["derive"] }
disjoint_impls = "1.4.5"
impls = "1.0.3"
sealed = "0.7.0"

[dev-dependencies]
static_assertions = "1.1.0"
trybuild = "1.0.121"

[[test]]
name = "ui"
required-features = ["alloc", "derive", "repr-rust"]

[[test]]
name = "abi"
required-features = ["alloc", "derive", "repr-rust"]

[[test]]
name = "export"
required-features = ["alloc", "derive", "repr-rust"]

[[test]]
name = "import"
required-features = ["alloc", "derive", "repr-rust"]
