[package]
name = "co3"

version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Marin Veršić <marin.versic101@gmail.com>"]
repository = "https://github.com/mversic/co3"
description = "Build C API from Rust"
keywords = ["FFI", "foreign", "dynamic", "linking", "ABI"]

categories = ["development-tools::ffi"]

[features]
default = ["owned_as_ref"]

# Enables references that don't maintain stable position in memory
#
# Conversion of owned types may become expensive if `owned_as_ref` is enabled.
# TODO: Find a better name for this feature flag
cloned_refs = []

# Enable ownership carrying types, i.e. heap-allocated types such as `Box<T>` or `Vec<T>`.
owned_types = []

# Send owned(heap-allocated) types as shared references instead of transferring ownership.
#
# With the notable exception are `Opaque` types which always carry ownership regardless, this
# feature prevents ownership transfer of dynamically allocated memory across FFI boundary.
#
# This feature will have the same effect as `cloned_ref` in that it will
owned_as_ref = ["owned_types"]

# Enables sharing mutable references of non-robust transmutable types across FFI.
#
# When handing out non-robust mutable references across FFI, it's possible for the caller
# to modify the given reference and store a trap representation causing immediate UB.
non_robust_ref_mut = []

# Enable deriving `extern C` ABI. Macros made available are:
# 2. `ExternC`/`extern_type`
# 1. `carbonate`/`decarbonate`
derive = ["co3_derive"]

# Enable integration with `getset` when deriving `extern C` ABI
getset = ["derive", "co3_derive/getset"]

[dependencies]
co3_derive = { path = "derive", optional = true }

derive_more = { version = "2.0.1", features = ["display"] }
disjoint_impls = "1.3.0"

# FIXME: Replace with never type https://github.com/rust-lang/rust/issues/35121
void = "1.0.2"

[dev-dependencies]
webassembly-test = "0.1.0"
getset = "0.1.6"

[workspace]
resolver = "2"
members = ["derive"]
