[package]
name = "co3"

version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Marin Veršić <marin.versic101@gmail.com>"]
repository = "https://github.com/mversic/co3"
description = "Build C API from Rust"
keywords = ["FFI", "foreign", "dynamic", "linking", "ABI"]

categories = ["development-tools::ffi"]

[features]
default = ["alloc"]

# Enable deriving `extern C` ABI. Macros made available are:
# - `#[derive(ReprC)]`
# - `#[export("ABI")]`
# - `extern_C!`/`extern_!`
derive = ["co3-derive"]

# Implements conversion traits for types from the `alloc` crate (e.g. `Box<T>` or `Vec<T>`).
alloc = []

[dependencies]
co3-derive = { path = "derive", optional = true }

# TODO: Should this get removed, it is not widely used
derive_more = { version = "2.1.1", features = ["display"] }
disjoint_impls = { path = "../disjoint_impls/" }
#disjoint_impls = "1.3.8"
impls = "1.0.3"

[dev-dependencies]
static_assertions = "1.1.0"

[workspace]
resolver = "2"
members = ["derive"]

[[test]]
name = "abi"
required-features = ["alloc", "derive"]

[[test]]
name = "export"
required-features = ["alloc", "derive"]

[[test]]
name = "import"
required-features = ["alloc", "derive"]
