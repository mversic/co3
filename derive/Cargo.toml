[package]
name = "co3_derive"

version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Marin Veršić <marin.versic101@gmail.com>"]
repository = "https://github.com/mversic/co3/derive"
description = "Derive macros for `CO3`"

[lib]
proc-macro = true

[features]
# Enable integration with `getset` when deriving `extern C` ABI
getset = []

[dependencies]
syn = { version = "2.0.104", features = ["full", "extra-traits", "visit", "visit-mut"] }
manyhow = { version = "0.11.4", features = ["darling"] }
strum = { version = "0.27.2", features = ["derive"] }
proc-macro2 = "1.0.97"
# FIX: Bump to 0.21.1. It breaks some code
darling = "0.20.10"
rustc-hash = "2.1.1"
drop_bomb = "0.1.5"
quote = "1.0.40"

[dev-dependencies]
co3 = { path = ".." }

trybuild = "1.0.110"
getset = "0.1.6"
