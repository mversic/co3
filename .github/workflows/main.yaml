name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@v2

    - name: Check formatting
      run: cargo fmt --all --check

    - name: Check documentation
      env:
        RUSTDOCFLAGS: -D warnings
      run: cargo doc --workspace --no-deps

    - name: Lint workspace
      run: cargo clippy --workspace --benches --tests --examples -- --deny warnings

    - name: Lint workspace (no default features)
      run: cargo clippy --workspace --benches --tests --examples --no-default-features -- --deny warnings

    - name: Lint workspace (alloc only)
      run: cargo clippy --workspace --benches --tests --examples --no-default-features --features alloc -- --deny warnings

    - name: Lint workspace (derive only)
      run: cargo clippy --workspace --benches --tests --examples --no-default-features --features derive -- --deny warnings

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rust-src
    - uses: Swatinem/rust-cache@v2
      with:
        key: test-${{ matrix.os }}

    - name: Run Tests
      env:
        RUSTFLAGS: -D warnings
      run: cargo test --workspace

  no-std:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: thumbv7em-none-eabi
    - uses: Swatinem/rust-cache@v2
      with:
        key: no-std

    - name: Check all features on target without std
      run: cargo check -p co3 --target thumbv7em-none-eabi --all-features

  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@nightly
      with:
        components: miri
    - uses: Swatinem/rust-cache@v2
      with:
        key: miri

    - name: Prepare Miri
      run: cargo miri setup

    - name: Run tests with leak checking under Tree Borrows
      env:
        MIRIFLAGS: -Zmiri-tree-borrows
      run: |
        cargo miri test --all-features --lib -- \
          --skip tests::encode_stored_mut_box_allows_pointer_replacement
        cargo miri test --all-features --test export
        cargo miri test --all-features --test abi
        cargo miri test --all-features --test import

    # Stable opaque types use ZST stand-ins. These tests form Rust references to those stand-ins
    # before passing their pointers back to the provider. Stacked Borrows rejects the resulting
    # zero-byte-to-full-allocation access; Tree Borrows, which has no subobject provenance, accepts
    # it. Rust's final aliasing rules for this pattern are not yet settled.
    - name: Run tests with leak checking under Stacked Borrows
      run: |
        cargo miri test --all-features --lib -- \
          --skip tests::encode_stored_mut_box_allows_pointer_replacement
        cargo miri test --all-features --test export
        cargo miri test --all-features --test abi -- \
          --skip handles::erased_handle_dispatch \
          --skip handles::static_parameters_behind_dyn_self_do_not_bind_symbols
        cargo miri test --all-features --test import -- \
          --skip opaque::constructs_and_uses_imported_opaque_handles \
          --skip opaque::imported_opaque_borrow_preserves_identity

    # Keep the leak exception scoped to this exact test in each command. All other
    # Miri invocations above use the default leak checking behavior.
    # FIXME: https://github.com/mversic/co3/issues/182
    - name: Run only the known leak case with leak checking disabled
      run: |
        MIRIFLAGS='-Zmiri-tree-borrows -Zmiri-ignore-leaks' cargo miri test --all-features --lib tests::encode_stored_mut_box_allows_pointer_replacement -- --exact
        MIRIFLAGS='-Zmiri-ignore-leaks' cargo miri test --all-features --lib tests::encode_stored_mut_box_allows_pointer_replacement -- --exact

  wasm-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2

      - name: Install wasmtime
        run: |
          curl -fsSL https://wasmtime.dev/install.sh | bash
          echo "$HOME/.wasmtime/bin" >> $GITHUB_PATH

      - name: Run Tests (WASIp1)
        # `trybuild` invokes Cargo for each fixture, which WASI cannot support.
        run: cargo test --workspace --target wasm32-wasip1 --lib --test abi --test export --test import
