name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@v2

    - name: Rust format
      run: cargo fmt --all --check

    - name: Clippy (all features)
      run: cargo clippy --workspace --tests --all-features -- --deny warnings

    - name: Clippy (no features)
      run: cargo clippy --workspace --tests --no-default-features -- --deny warnings

  test:
    runs-on: ${{ matrix.os }}
    needs: static-analysis
    timeout-minutes: 5

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        feature_suffix:
        - ""
        - "owned-as-ref"
        - "unsafe-optimizations"

    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
      with:
        key: test-${{ matrix.os }}-${{ matrix.feature_suffix }}

    - name: Run Tests
      run: cargo test --workspace --no-default-features --features "alloc,derive,unstable-refs,${{ matrix.feature_suffix }}"

  wasm-test:
    runs-on: ubuntu-latest
    needs: static-analysis
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2

      - name: Install wasmtime
        run: |
          curl -fsSL https://wasmtime.dev/install.sh | bash
          echo "$HOME/.wasmtime/bin" >> $GITHUB_PATH

      - name: Run Tests (WASIp1)
        run: cargo test --target wasm32-wasip1 --all-features
