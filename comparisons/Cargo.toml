[package]
name = "co3-framework-comparisons"
version = "0.0.0"
edition = "2021"
publish = false
autoexamples = false

[workspace]

[features]
default = []
tracing = []
co3 = ["dep:co3"]
uniffi = ["dep:uniffi"]
boltffi = ["dep:boltffi"]
safer_ffi = ["dep:safer-ffi"]
interoptopus = ["dep:interoptopus"]
diplomat = ["dep:diplomat", "dep:diplomat-runtime"]

[dependencies]
comparison-types = { path = "support/types" }
co3 = { path = "..", optional = true }
uniffi = { git = "https://github.com/mozilla/uniffi-rs", rev = "2124d553b73444890fd913b90d8fdd98620def1d", default-features = false, features = ["macro-scaffolding"], optional = true }
diplomat = { version = "=0.17.0", optional = true }
diplomat-runtime = { version = "=0.16.1", optional = true }
interoptopus = { version = "=0.16.6", optional = true }
safer-ffi = { version = "=0.1.13", features = ["headers", "dyn-traits"], optional = true }
boltffi = { version = "=0.32.1", default-features = false, optional = true }

